<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2350"/>
      <stop offset="1" stop-color="#0B0F26"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="1" x2="0.6" y2="0">
      <stop offset="0" stop-color="#FF5A1F"/>
      <stop offset="1" stop-color="#FFB53D"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1024" height="1024" rx="232"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <!-- Strasse als S-Kurve (Ideallinie) -->
    <path id="p" d="M 250 1100 C 250 700, 790 720, 760 500 C 735 300, 420 330, 480 -80"
          fill="none" stroke="url(#road)" stroke-width="176" stroke-linecap="butt"/>
    <!-- Mittellinie -->
    <path d="M 250 1100 C 250 700, 790 720, 760 500 C 735 300, 420 330, 480 -80"
          fill="none" stroke="#0B0F26" stroke-width="18" stroke-dasharray="54 46" stroke-linecap="round" opacity="0.85"/>
    <!-- Fahrer-Punkt am Scheitelpunkt -->
    <circle cx="760" cy="500" r="74" fill="#0B0F26"/>
    <circle cx="760" cy="500" r="54" fill="#FFFFFF"/>
    <circle cx="760" cy="500" r="22" fill="#FF5A1F"/>
  </g>
</svg>
